<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オレカバトル2 コマンド＆キャパシティシミュレーター</title>
  <!-- メインスタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 画面上部：ヘッダーナビゲーション -->
  <header>
    <div class="header-container">
      <div class="title-group">
        <div class="title-icon">⚔️</div>
        <div>
          <h1 style="font-size: 1.125rem; font-weight: bold;">オレカバトル2 コマンドシミュレーター</h1>
          <p style="font-size: 0.75rem; color: #94a3b8;">育成・キャパシティ計算ツール</p>
        </div>
      </div>
      
      <!-- ヘッダー操作UI（章選択・モンスター選択・お気に入り・編集画面移行） -->
      <div class="header-actions">
        <div>
          <label for="chapterSelect" style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1;">章:</label>
          <select id="chapterSelect" onchange="onChapterChange(this.value)"></select>
        </div>
        <div>
          <label for="monsterSelect" style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1;">モンスター:</label>
          <select id="monsterSelect" onchange="selectMonster(this.value)"></select>
        </div>
        <button class="btn btn-amber" onclick="openFavoritesModal()">⭐ お気に入り一覧</button>
        <a href="admin.html" class="btn" style="text-decoration: none; font-size: 0.875rem;">🛠️ データ編集</a>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main>
    <!-- モンスター基本ステータスカード -->
    <div class="glass-card monster-info">
      <div>
        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; flex-wrap: wrap;">
          <span class="badge badge-amber">SELECTED</span>
          <span id="monsterIdBadge" class="badge badge-id">ID: --</span>
          <span id="monsterChapter" class="badge badge-slate">--</span>
          <span id="monsterAttribute" class="badge badge-slate">--</span>
          <span id="monsterRace" class="badge badge-slate">--</span>
        </div>
        <h2 id="monsterName" style="font-size: 1.5rem; font-weight: bold; color: #ffffff;">--</h2>
        <p id="monsterStats" style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.5rem; font-family: monospace;">--</p>
        
        <!-- EX技・超EX技の表示領域 -->
        <div id="monsterExSkillArea" style="margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed #334155; font-size: 0.8rem; display: flex; flex-direction: column; gap: 0.35rem;">
          <div>
            <span style="color: #fcd34d; font-weight: bold;">【EX技】</span> 
            <span id="exName" style="color: #ffffff; font-weight: bold;">--</span> : 
            <span id="exEffect" style="color: #cbd5e1;">--</span>
          </div>
          <div>
            <span style="color: #f43f5e; font-weight: bold;">【超EX技】</span> 
            <span id="superExName" style="color: #ffffff; font-weight: bold;">--</span> : 
            <span id="superExEffect" style="color: #cbd5e1;">--</span>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
        <span style="font-size: 0.75rem; color: #34d399; font-family: monospace;">✓ 読み込み完了</span>
        <button class="btn btn-amber" onclick="saveCurrentFavorite()">💾 この構成をお気に入り保存</button>
      </div>
    </div>

    <!-- 各リールを表示するコンテナ -->
    <div id="reelsContainer" class="grid-reels"></div>

    <!-- 習得可能コマンド（技）の説明・コメント一覧セクション -->
    <div class="glass-card" style="margin-top: 1.5rem;">
      <h3 style="color: #fbbf24; margin-bottom: 0.5rem; font-size: 1.125rem;">📖 習得可能コマンド（技）の解説</h3>
      <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 1rem;">このモンスターが覚えることのできる技のタイプや、コスト、詳細コメントの一覧です。</p>
      <div id="skillDescriptionsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.75rem;"></div>
    </div>

    <!-- 1ターン目 技発動確率シミュレーターセクション -->
    <div class="glass-card" style="margin-top: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
        <h3 style="color: #fbbf24; font-size: 1.125rem;">📊 1ターン目 技発動確率</h3>
        <button class="btn btn-amber" onclick="renderFirstTurnProbability()">🔄 再計算</button>
      </div>
      <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 1rem;">現在のリール構成から、1ターン目にそれぞれの技が発動する確率を算出します。</p>
    <div id="firstTurnProbResult">
    <!-- ここに計算結果がテキストとして一覧表示されます -->
  </div>
</div>
  </main>


  <!-- お気に入り保存・並び替え用モーダル画面 -->
  <div id="favoritesModal" class="modal-overlay" onclick="closeFavoritesModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 style="font-weight: bold; color: #fbbf24;">⭐ お気に入り保存されたコマンド構成</h3>
        
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <select id="sortOrder" onchange="renderFavoritesList()" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">
            <option value="newest">新しい順</option>
            <option value="oldest">古い順</option>
            <option value="name">モンスター名順</option>
            <option value="chapter">章順</option>
          </select>
          <button class="btn" onclick="closeFavoritesModal()">✕ 閉じる</button>
        </div>

      </div>
      <div id="favoritesListBody" class="modal-body"></div>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="skills.js"></script> <!-- 技データの読み込み -->
  <script src="monsters.js"></script> <!-- モンスターのデータ読み込み -->
  <script src="favorites.js"></script> <!-- お気に入り保存・管理用スクリプト -->
  <script src="probability.js"></script> <!-- 技発動確率計算用スクリプト -->

  <!-- アプリ本体の制御スクリプト -->
  <script>
    let allMonstersList = [];
    let currentMonster = null;
    let currentReels = [];

    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    function initApp() {
      allMonstersList = [];
      if (typeof MONSTERS === 'undefined') {
        alert('monsters.js が読み込めませんでした。');
        return;
      }

      if (Array.isArray(MONSTERS)) {
        allMonstersList = MONSTERS;
      } else {
        Object.keys(MONSTERS).forEach(chapterKey => {
          const list = MONSTERS[chapterKey];
          if (Array.isArray(list)) {
            list.forEach(m => {
              allMonstersList.push({
                ...m,
                chapter: m.chapter || chapterKey
              });
            });
          }
        });
      }

      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '';

      const chapters = Array.isArray(MONSTERS) 
        ? [...new Set(allMonstersList.map(m => m.chapter || '共通'))]
        : Object.keys(MONSTERS);

      chapters.forEach(ch => {
        const option = document.createElement('option');
        option.value = ch;
        option.textContent = ch;
        chapterSelect.appendChild(option);
      });

      if (chapters.length > 0) {
        onChapterChange(chapters[0]);
      }
    }

    function onChapterChange(selectedChapter) {
      const monsterSelect = document.getElementById('monsterSelect');
      monsterSelect.innerHTML = '';

      const filtered = allMonstersList.filter(m => (m.chapter || '共通') === selectedChapter);

      if (filtered.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '該当モンスターなし';
        monsterSelect.appendChild(option);
        return;
      }

      filtered.forEach(m => {
        const option = document.createElement('option');
        option.value = m.id;
        option.textContent = `[★${m.rarity || '?'}] ${m.name} (${m.id})`;
        monsterSelect.appendChild(option);
      });

      selectMonster(filtered[0].id);
    }

    function selectMonster(monsterId, customReels = null) {
      currentMonster = allMonstersList.find(m => m.id === monsterId);
      if (!currentMonster) return;

      const chapterSelect = document.getElementById('chapterSelect');
      if (chapterSelect.value !== currentMonster.chapter) {
        chapterSelect.value = currentMonster.chapter;
        updateMonsterSelectOptions(currentMonster.chapter, currentMonster.id);
      } else {
        document.getElementById('monsterSelect').value = currentMonster.id;
      }

      document.getElementById('monsterName').textContent = currentMonster.name || '--';
      document.getElementById('monsterIdBadge').textContent = `ID: ${currentMonster.id || '--'}`;
      document.getElementById('monsterChapter').textContent = currentMonster.chapter || '章不明';
      document.getElementById('monsterAttribute').textContent = `属性: ${currentMonster.attribute || '不明'}`;
      document.getElementById('monsterRace').textContent = `種族: ${currentMonster.race || '不明'}`;
      
      const stats = currentMonster.stats || {};
      document.getElementById('monsterStats').textContent = `HP: ${stats.hp || '???'} | 攻撃: ${stats.attack || '???'} | スピード: ${stats.speed || '??Z'}`.replace('??Z', '???');

      // 💡 EX技・超EX技の表示更新処理
      const exData = currentMonster.exSkill;
      if (typeof exData === 'object' && exData !== null) {
        document.getElementById('exName').textContent = exData.normal?.name || '未入力';
        document.getElementById('exEffect').textContent = exData.normal?.effect || '未入力';
        document.getElementById('superExName').textContent = exData.super?.name || '未入力';
        document.getElementById('superExEffect').textContent = exData.super?.effect || '未入力';
      } else if (typeof exData === 'string') {
        // 文字列の旧データが存在する場合の互換処理
        document.getElementById('exName').textContent = exData;
        document.getElementById('exEffect').textContent = '未入力';
        document.getElementById('superExName').textContent = '未入力';
        document.getElementById('superExEffect').textContent = '未入力';
      } else {
        document.getElementById('exName').textContent = '未入力';
        document.getElementById('exEffect').textContent = '未入力';
        document.getElementById('superExName').textContent = '未入力';
        document.getElementById('superExEffect').textContent = '未入力';
      }

      const reelCount = (currentMonster.maxCapacity && currentMonster.maxCapacity.length) 
        ? currentMonster.maxCapacity.length 
        : (currentMonster.rarity || 1);

      currentReels = [];
      for (let reelIdx = 0; reelIdx < reelCount; reelIdx++) {
        const sourceSlot = customReels && customReels[reelIdx] 
          ? customReels[reelIdx] 
          : (currentMonster.initialReels && currentMonster.initialReels[reelIdx] ? currentMonster.initialReels[reelIdx] : []);
        
        const reel = [];
        for (let slotIdx = 0; slotIdx < 6; slotIdx++) {
          const rawId = sourceSlot[slotIdx];
          reel.push(rawId !== undefined && rawId !== null ? rawId : 3);
        }
        currentReels.push(reel);
      }

      renderReels(); <!-- リールUIの描画 -->
      renderSkillDescriptions(); <!-- 技解説の描画 -->
      updateCalcSkillOptions(); <!-- 確率計算用の技選択肢を更新 -->

      renderFirstTurnProbability(); <!-- 初期表示時に1ターン目確率を計算して表示 -->
    }

    function updateMonsterSelectOptions(chapter, activeId) {
      const monsterSelect = document.getElementById('monsterSelect');
      monsterSelect.innerHTML = '';
      const filtered = allMonstersList.filter(m => (m.chapter || '共通') === chapter);
      filtered.forEach(m => {
        const option = document.createElement('option');
        option.value = m.id;
        option.textContent = `[★${m.rarity || '?'}] ${m.name} (${m.id})`;
        if (m.id === activeId) option.selected = true;
        monsterSelect.appendChild(option);
      });
    }

    function getColorLabel(colorCode) {
      switch (colorCode) {
        case 'オ': return '🟧 ';
        case '砂': return '⬜ ';
        case '銅': return '🟫 ';
        case '銀': return '⬜ ';
        case '金': return '🟨 ';
        default:   return `[${colorCode || '無'}]`;
      }
    }

    function generateSkillOptions(selectedSkillId) {
      if (typeof SKILLS === 'undefined') return '<option value="3">ミス (コスト:0)</option>';

      let availableIds = currentMonster.availableSkillIds;
      if (!availableIds || availableIds.length === 0) {
        availableIds = Object.keys(SKILLS);
      }

      if (selectedSkillId !== undefined && selectedSkillId !== null && !availableIds.includes(selectedSkillId)) {
        availableIds = [selectedSkillId, ...availableIds];
      }

      return availableIds.map(id => {
        const skill = SKILLS[id];
        if (!skill) {
          const isSelected = (id == selectedSkillId) ? 'selected' : '';
          return `<option value="${id}" ${isSelected}>技ID:${id} (未定義)</option>`;
        }
        const selected = (id == selectedSkillId) ? 'selected' : '';
        const colorLabel = getColorLabel(skill.color);
        return `<option value="${id}" ${selected}>${colorLabel} ${skill.name} (コスト:${skill.cost})</option>`;
      }).join('');
    }

    function renderReels() {
      const container = document.getElementById('reelsContainer');
      container.innerHTML = '';

      if (!currentMonster || currentReels.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; grid-column: span 4; text-align: center;">モンスターデータが見つかりません。</p>';
        return;
      }

      currentReels.forEach((reelSkills, reelIdx) => {
        const maxCap = (currentMonster.maxCapacity && currentMonster.maxCapacity[reelIdx] !== undefined) 
          ? currentMonster.maxCapacity[reelIdx] 
          : 0;

        let usedCap = 0;
        reelSkills.forEach(skillId => {
          if (SKILLS && SKILLS[skillId]) {
            usedCap += SKILLS[skillId].cost;
          }
        });

        const usagePercent = maxCap > 0 ? Math.min(100, (usedCap / maxCap) * 100) : 0;
        const isOver = maxCap > 0 && usedCap > maxCap;

        const reelCard = document.createElement('div');
        reelCard.className = 'glass-card';

        let slotsHtml = '';
        for (let slotIdx = 0; slotIdx < 6; slotIdx++) {
          const currentSkillId = reelSkills[slotIdx];
          const skill = SKILLS ? SKILLS[currentSkillId] : null;
          const skillColor = skill ? (skill.color === 'オ' ? 'オレンジ' : skill.color) : '砂';

          slotsHtml += `
            <div class="slot-item">
              <span class="slot-num">${slotIdx + 1}</span>
              <select class="slot-select color-${skillColor}" onchange="updateSlot(${reelIdx}, ${slotIdx}, this.value)">
                ${generateSkillOptions(currentSkillId)}
              </select>
            </div>
          `;
        }

        reelCard.innerHTML = `
          <div>
            <div class="reel-header">
              <span class="reel-title">★${reelIdx + 1} <span style="font-size: 0.75rem; color: #94a3b8; font-weight: normal;">リール</span></span>
              <span class="cap-badge ${isOver ? 'over' : ''}">
                ${usedCap.toFixed(1)} / ${maxCap > 0 ? maxCap.toFixed(1) : '未設定'}
              </span>
            </div>

            <div class="meter-bg">
              <div class="meter-fill ${isOver ? 'over' : ''}" style="width: ${maxCap > 0 ? usagePercent : 0}%"></div>
            </div>

            <div class="slot-list">
              ${slotsHtml}
            </div>
          </div>
        `;

        container.appendChild(reelCard);
      });
    }

    function updateSlot(reelIdx, slotIdx, newSkillId) {
      const parsedId = isNaN(Number(newSkillId)) ? newSkillId : Number(newSkillId);
      currentReels[reelIdx][slotIdx] = parsedId;
      renderReels();

      renderFirstTurnProbability(); <!-- スロット変更後に1ターン目確率を再計算して表示 -->
    }

    function renderSkillDescriptions() {
      const container = document.getElementById('skillDescriptionsContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!currentMonster || !currentMonster.availableSkillIds || currentMonster.availableSkillIds.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; font-size: 0.8rem; grid-column: span 2;">このモンスターに設定された習得可能コマンドはありません。</p>';
        return;
      }

      currentMonster.availableSkillIds.forEach(id => {
        const skill = typeof SKILLS !== 'undefined' ? SKILLS[id] : null;
        
        const card = document.createElement('div');
        card.style.background = '#0f172a';
        card.style.border = '1px solid #334155';
        card.style.borderRadius = '0.5rem';
        card.style.padding = '0.75rem';

        if (!skill) {
          card.innerHTML = `<span style="font-size: 0.8rem; color: #94a3b8;">技ID: ${id} (未定義)</span>`;
          container.appendChild(card);
          return;
        }

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; flex-wrap: wrap; gap: 0.5rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span style="font-weight: bold; color: #fbbf24; font-size: 0.875rem;">${skill.name}</span>
            </div>
            <div style="display: flex; gap: 0.35rem; align-items: center; font-size: 0.7rem;">
              <span style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 0.1rem 0.4rem; border-radius: 0.25rem;">[${skill.type || '不明'}]</span>
              <span style="background: #1e293b; color: #fbbf24; border: 1px solid #334155; padding: 0.1rem 0.4rem; border-radius: 0.25rem;">コスト: ${skill.cost}</span>
            </div>
          </div>
          <div style="font-size: 0.75rem; color: #94a3b8; line-height: 1.4; border-top: 1px dashed #1e293b; padding-top: 0.35rem; margin-top: 0.25rem;">
            ${skill.comment ? skill.comment : '詳細コメントはありません。'}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
